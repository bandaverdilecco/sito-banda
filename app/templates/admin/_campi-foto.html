<div class="field"><label for="src">Collegamento immagine</label><input id="src" name="src" value="{{ values.get('src', '') }}" placeholder="https://… oppure /assets/…"><p class="help">Inserisci un collegamento oppure carica un file qui sotto.</p></div>
<div class="field"><label for="image_upload">Carica un’immagine</label><input type="file" id="image_upload" name="image_upload" accept="image/jpeg,image/png,image/webp,image/gif"><p class="help">JPG, PNG, WebP o GIF. Un file caricato sostituisce il collegamento.</p></div>
<div class="field"><label for="alt">Descrizione dell’immagine</label><input id="alt" name="alt" value="{{ values.get('alt', '') }}"><p class="help">Descrivi brevemente la foto per le persone che utilizzano un lettore di schermo.</p></div>
<div class="field"><label for="sort_order">Ordine</label><input type="number" step="1" id="sort_order" name="sort_order" value="{{ values.get('sort_order', 0) }}"><p class="help">I numeri più bassi compaiono per primi.</p></div>
