{% extends "admin/base.html" %}
{% block title %}Elimina foto{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('admin.photos', album_id=album.id) }}">← {{ album.title }}</a>
<section class="panel confirmation"><span class="eyebrow">Conferma eliminazione</span><h1>Eliminare questa foto?</h1><img class="image-preview" src="{{ photo.src if photo.src.startswith('/') or '://' in photo.src else '/' ~ photo.src }}" alt="{{ photo.alt }}"><p>La foto verrà rimossa dall’album <strong>{{ album.title }}</strong>. Questa operazione non può essere annullata dal pannello.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-actions"><button class="button danger" type="submit">Elimina foto</button><a class="button secondary" href="{{ url_for('admin.photos', album_id=album.id) }}">Annulla</a></div></form></section>
{% endblock %}
