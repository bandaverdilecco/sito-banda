<form method="post" action="{{ url_for('editorial.move_entry', section=section, item_id=record.id) }}" class="order-actions">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button type="submit" name="direction" value="up" aria-label="Sposta su: {{ entry_name }}" title="Sposta su" {% if first %}disabled{% endif %}>↑</button>
  <button type="submit" name="direction" value="down" aria-label="Sposta giù: {{ entry_name }}" title="Sposta giù" {% if last %}disabled{% endif %}>↓</button>
  <span class="help" role="alert" data-order-error hidden>Spostamento non riuscito. Riprova o ricarica la pagina.</span>
</form>
