<form method="post" action="{{ url_for('admin.publication', section=section, item_id=record.id) }}" class="publication-control" data-publication>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label><input type="checkbox" name="hidden" value="1" {% if not record.published %}checked{% endif %}> Nascosto<span class="sr-only">: {{ entry_name }}</span></label>
  <button type="submit" class="button small secondary">Salva visibilità</button>
  <span class="help" role="alert" data-publication-error hidden>Salvataggio non riuscito. Riprova.</span>
</form>
