# Configurazione di un sito, da includere nel blocco http di Nginx.
# Sostituisci banda.example.it con il dominio reale prima di abilitarla.
# Avvia Waitress su 127.0.0.1:8080 con APP_TRUST_PROXY=1.
# Questo file parte in HTTP: abilita TLS prima di usare APP_HTTPS=1.
server {
    listen 80;
    listen [::]:80;
    server_name banda.example.it;

    client_max_body_size 16m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Un solo proxy fidato: sovrascrivi gli header inviati dal client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
    }
}
