<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <meta content="{{metaDescription}}" name="description" />
    <title>{{title}} · {{date}} · Fotografie</title>
    <link href="../assets/Logo_filarmonica.svg" rel="icon" type="image/svg+xml" />
    <link href="../styles.css" rel="stylesheet" />
    <script src="../gallery.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    <!-- include: header -->
    <!-- CONTENUTO: titolo, data, descrizione e cartella sono in data/albums.json. -->
    <main id="contenuto">
      <section class="page-hero gallery-hero">
        <div class="container">
          <a class="back-link" href="../foto.html#foto-{{year}}">← Tutti gli album</a>
          <span class="eyebrow">{{date}}</span>
          <h1>{{title}}</h1>
          {{description}}
        </div>
      </section>
      <section class="container page-body" aria-label="Fotografie dell’album">
        {{gallery}}
        <a class="text-link gallery-back" href="../foto.html#foto-{{year}}">Tutti gli album</a>
      </section>
    </main>
    <!-- include: footer -->
  </body>
</html>
