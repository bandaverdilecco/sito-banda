<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <meta content="Gli album fotografici della Filarmonica Giuseppe Verdi di Lecco: concerti, feste e momenti insieme." name="description" />
    <title>Fotografie · Filarmonica Giuseppe Verdi Lecco</title>
    <link href="assets/Logo_filarmonica.svg" rel="icon" type="image/svg+xml" />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    <!-- include: header -->
    <!-- CONTENUTO: i dati degli album sono in data/albums.json. Modifica qui l’impaginazione. -->
    <main id="contenuto">
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">La Filarmonica in immagini</span>
          <h1>Fotografie</h1>
          <p>Concerti, feste e momenti insieme. Scegli un album per vedere le fotografie.</p>
        </div>
      </section>
      <nav aria-label="Album per anno" class="section-index">
        <div class="container section-index-inner">
          <div class="section-index-links">
{{yearLinks}}
          </div>
        </div>
      </nav>
      <div class="container page-body photo-archive">
{{albumSections}}
      </div>
    </main>
    <!-- include: footer -->
  </body>
</html>
